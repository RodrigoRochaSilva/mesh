<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completing sign-in...</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f6f7; color: #1f2937; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 10px; padding: 18px; max-width: 420px; box-shadow: 0 4px 18px rgba(0,0,0,.12); }
    .title { font-size: 18px; margin: 0 0 8px; }
    .msg { font-size: 14px; margin: 0; }
  </style>
  <script src="libs/localforage-1.10.0/localforage.min.js"></script>
  <script src="auth.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 class="title">Completing Google sign-in...</h1>
      <p id="status" class="msg">Please wait a few seconds.</p>
    </div>
  </div>
  <script>
    (async function () {
      const statusEl = document.getElementById('status');
      try {
        await window.Auth.completeGoogleOAuthFromCurrentUrl();
        statusEl.textContent = 'Sign-in complete. Redirecting...';
        window.location.replace('/index.html?oauth=success');
      } catch (err) {
        const message = (err && err.message) ? err.message : 'Google sign-in failed.';
        statusEl.textContent = message;
        setTimeout(() => {
          const qs = new URLSearchParams({
            oauth: 'error',
            oauth_msg: message
          });
          window.location.replace(`/index.html?${qs.toString()}`);
        }, 1500);
      }
    })();
  </script>
</body>
</html>
