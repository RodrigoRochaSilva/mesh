<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mesh</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#39693C">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Navegação de tarefas de campo do ecossistema FieldRank e AgroXeque">
    <meta name="application-name" content="mesh">
    <meta name="apple-mobile-web-app-title" content="mesh">

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="apple-touch-startup-image" href="/icons/icon-512x512.png">

    <link rel="stylesheet" href="libs/leaflet-1.7.1/leaflet.css">
    <link rel="stylesheet" href="styles.css">

    <script src="libs/leaflet-1.7.1/leaflet.js"></script>
    <script src="libs/d3-7.8.5/d3.min.js"></script>
    <script src="libs/localforage-1.10.0/localforage.min.js"></script>
</head>
<body>
    <div id="install-instructions-modal" class="install-modal hidden">
        <div class="install-modal-content">
            <h3>Instalar mesh</h3>
            <div id="install-instructions-text"></div>
            <button id="close-install-modal" class="custom-button close-modal-btn">Continuar no navegador</button>
        </div>
    </div>

    <div class="header">
        <div class="header-content">
            <div class="logo-container">
                <img src="imagens/logo_principal.png" alt="Logotipo do mesh" class="logo">
            </div>
            <p class="header-note">
                <span class="ecosystem-full">Este app faz parte do ecossistema <strong>FieldRank &middot; AgroXeque</strong></span>
                <span class="ecosystem-short">FieldRank &middot; AgroXeque</span>
            </p>
            <div class="header-right">
                <button id="install-help-button" class="install-help-button" type="button" aria-label="Ajuda para instalação" title="Ajuda para instalação">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9.2 9.3a2.9 2.9 0 0 1 5.6 1c0 1.9-2.8 2.5-2.8 4.2"></path>
                        <circle cx="12" cy="17.6" r="1.05" fill="currentColor" stroke="none"></circle>
                    </svg>
                </button>
                <div class="line2">
                    <span id="app-version-display"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="map-container">
        <div id="map"></div>
        <div id="install-button-container"></div>
        <div class="button-container">
            <button id="loadGeojson" class="custom-button">Carregar Tarefa</button>
        </div>
        <div id="legend"></div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="login-modal">
        <div class="login-modal-content">
            <div class="login-header">
                <img src="imagens/logo_principal.png" alt="Logotipo do mesh" class="login-logo">
                <h2>Entrar</h2>
                <p class="login-info">Use as mesmas credenciais que você usa na plataforma principal</p>
            </div>
            <form id="login-form" method="post" action="#">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="voce@email.com">
                </div>
                <div class="form-group form-group-spaced">
                    <label for="login-password">Senha</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Sua senha">
                        <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar senha">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="login-error" class="error-message hidden"></div>
                <button type="submit" id="login-submit" class="custom-button login-button">
                    <span class="button-text">Entrar</span>
                    <span class="button-loader hidden">&#x23F3;</span>
                </button>
            </form>
        </div>
    </div>

    <!-- SAFE ZONE: API configuration protected from obfuscation -->
    <script src="env.js"></script>

    <script src="version.js"></script>
    <script src="auth.js"></script>
    <script src="scripts.js" defer></script>

    <script src="sw-register.js"></script>

</body>
</html>
